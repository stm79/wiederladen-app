# Auto-loaded by `docker compose up` alongside docker-compose.yml whenever no
# explicit `-f` flags are given — i.e. exactly local/dev usage (Docker Desktop,
# no reverse proxy in front). Publishes the app directly on localhost:3000.
#
# Production (explicit -f docker-compose.yml -f docker-compose.prod.yml) does
# NOT pick this file up, so no host port gets published there.
services:
  app:
    ports:
      - "3000:3000"
