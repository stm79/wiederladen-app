services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Only relevant once served through a reverse proxy on a real domain
      # (set DOMAIN in .env there) — see README "Produktions-Deployment".
      # Empty/unset is a no-op for local use.
      - ALLOWED_ORIGIN=${DOMAIN}
    volumes:
      - ./data/db:/app/data/db
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
